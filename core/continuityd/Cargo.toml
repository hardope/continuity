[package]
name = "continuityd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Clipboard, file, and (eventually) keyboard continuity over LAN"

[[bin]]
name = "continuityd"
path = "src/main.rs"

[features]
# Real remote-control (keyboard/mouse injection + screen capture) —
# macOS and Windows only (see remote_control_mac.rs/remote_control_windows.rs).
# On by default; a "lite" release build passes `--no-default-features` to
# compile it out entirely rather than just hiding it behind a disabled UI
# toggle — the heavy platform APIs and the Screen Recording/Accessibility/
# Input Monitoring permission prompts they trigger never get linked in at
# all, for anyone who doesn't want this capability on their machine.
default = ["remote-control"]
remote-control = ["dep:softbuffer", "dep:image"]

# Consumed by `cargo deb` (see the "linux" leg of .github/workflows/release.yml)
# to build a .deb instead of shipping a bare binary that needs its shared-lib
# runtime dependencies (libxdo3, libayatana-appindicator3-1, etc.) installed
# by hand. `"$auto"` runs `ldd` against the built binary and resolves each
# .so it links to the Debian package that provides it — exactly the set of
# packages a user would otherwise have to guess at from a "cannot open
# shared object file" error, covering GTK (already needed for the tray
# icon, and now also rfd's dialogs — see the `rfd` dependency override
# below) without listing it by hand.
[package.metadata.deb]
maintainer = "hardope"
copyright = "2026, hardope"
extended-description = "Cross-platform clipboard, file, and (eventually) keyboard continuity across macOS, Windows, Linux, Android, and iOS over the local network — no cloud relay, no account."
section = "utils"
priority = "optional"
depends = ["$auto"]
assets = [
    ["target/release/continuityd", "usr/bin/", "755"],
    ["../../installers/linux/continuity.desktop", "usr/share/applications/", "644"],
    ["../../assets/logo.svg", "usr/share/icons/hicolor/scalable/apps/continuity.svg", "644"],
]

[dependencies]
continuity-daemon.workspace = true
continuity-crypto.workspace = true
continuity-proto.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
directories = "5"
tray-icon = "0.24"
tao = "0.34"
notify-rust = "4"
# Both power the remote-control *viewer* window (any desktop platform can
# be the controlling side, not just macOS/Windows — those two are just
# the only ones that can currently be the *controlled* side, which is
# the OS-specific half in remote_control_mac.rs/remote_control_windows.rs).
# `softbuffer` presents a plain CPU-drawn pixel buffer into a `tao`
# window with no GPU/graphics-API setup — the video here is just a
# decoded JPEG blitted in a few times a second, nowhere near demanding
# enough to justify wgpu or similar. `image` decodes the incoming JPEG
# frames; on Windows it doubles as the *encoder* for this device's own
# outgoing capture (see remote_control_windows.rs) — one dependency
# either way, not two.
softbuffer = { version = "0.4", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg"], optional = true }

# Not listed unconditionally: rfd's `gtk3` and `xdg-portal` features are
# mutually exclusive (its build.rs hard-panics if both end up enabled —
# found the hard way when CI's Linux build failed), and Cargo unions
# feature requests for the same dependency across every declaration that
# reaches it, regardless of target `cfg` — so a plain `rfd = "0.15"` here
# (implying its default `xdg-portal` feature) *plus* a Linux-only
# `features = ["gtk3"]` override below would both end up requested at
# once on Linux. Each platform gets its own complete, target-scoped
# declaration instead — see below.
[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = "0.15"

# Global media-key injection and now-playing metadata reads (see
# src/media_mac.rs) — posting a synthetic NSEventTypeSystemDefined event and
# calling the private MediaRemote.framework are the standard, widely-used
# tricks for controlling/reading whatever's currently playing system-wide
# (Music, Spotify, browser tabs, ...) without per-app integration. Most of
# these crates are already pulled in transitively by tray-icon's macOS
# backend; declared directly here for the specific methods/types this
# needs, which aren't all enabled by tray-icon's own feature selection.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSEvent", "NSGraphicsContext", "objc2-core-graphics"] }
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"
objc2-foundation = "0.3"
block2 = "0.6"
dispatch2 = "0.3"
libc = "0.2"
# For AXIsProcessTrustedWithOptions's CFDictionary argument (see
# media_mac.rs::ensure_accessibility_trust) — already pulled in
# transitively by other macOS dependencies, just not previously used
# directly. A purpose-built, safe wrapper around exactly this
# build-a-CFDictionary-and-call-a-C-API pattern, rather than hand-rolling
# raw CFDictionaryRef construction or press-ganging a toll-free-bridged
# NSDictionary into service for it.
core-foundation = "0.10"

# Global media-key injection (SendInput) and now-playing metadata reads
# (the WinRT GlobalSystemMediaTransportControlsSessionManager API) — see
# src/media_windows.rs. Win32_Graphics_Gdi/Win32_UI_WindowsAndMessaging
# are for remote_control_windows.rs's screen capture (classic BitBlt-based
# GDI capture — see that file's doc comment for why GDI over the newer
# Desktop Duplication API).
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Media_Control",
    "Foundation",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
] }

# MPRIS media control/reads over D-Bus — see src/media_linux.rs. Also
# carries rfd's Linux dialog backend (see the non-Linux `rfd` entry above
# for why this can't just add a feature on top of that one): `default-
# features = false` + `gtk3` only, no `xdg-portal`. `rfd::MessageDialog`
# (Reset confirmation, pairing-request accept/decline) has no XDG Desktop
# Portal equivalent at all — Portal has no message-dialog API — so on a
# portal-only build rfd falls back to shelling out to the external
# `zenity` binary, which does nothing useful if it isn't installed (a real
# bug: reported as "Reset doesn't bring up the confirm dialogue" and,
# since the pairing-request dialog goes through the exact same
# `MessageDialog::show()` call, also as "a Mac connecting to Linux doesn't
# show anything on the Linux side"). `gtk3` gives rfd a real, directly-
# linked implementation of both `MessageDialog` *and* `FileDialog`
# instead of splitting them across two different backends — and GTK is
# already a mandatory runtime dependency here regardless, since tray-icon
# needs it for the tray icon itself, so this doesn't add any new system
# requirement.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "4"
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
# Remote-control screen capture and input injection via xdg-desktop-portal
# (RemoteDesktop + ScreenCast) — see remote_control_linux.rs's module doc
# comment for the Wayland-vs-X11 rationale and, importantly, which half
# of that file is actually verified. `futures-util` is just for
# `MessageStream`'s `.next()` (zbus streams are plain `futures::Stream`s,
# not something zbus itself re-exports a combinator for).
futures-util = "0.3"
pipewire = "0.8"
# `call_portal_method`'s generic bound (`B: serde::Serialize + ...`) names
# `serde` directly — already pulled in transitively via zbus/continuity-proto,
# but a trait bound needs the crate declared here to resolve `serde::` at all.
serde = "1"
