[package]
name = "continuity-net"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
continuity-proto.workspace = true
continuity-crypto.workspace = true
tokio.workspace = true
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
mdns-sd = "0.13"
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
bytes = "1"
x509-parser = "0.16"
# TCP_NODELAY and SO_KEEPALIVE — tokio's TcpStream exposes the former
# directly but not the latter. Already in the dependency tree transitively
# (tokio itself uses it internally on some platforms), so this adds
# essentially no extra compile time or binary size, just a direct API to
# what's already being built.
socket2 = "0.5"
