<svg width="100" height="100" viewBox="-10 -10 120 120" xmlns="http://www.w3.org/2000/svg">
  <!--
    Continuity's mark: two interlocking rings at roughly right angles to
    each other, like a real chain link — not two parallel rings (reads as
    a slanted figure-8) and not centered on top of each other (the holes
    swallow each other into a blob). Each ring's far end stays clear of
    the other so both holes stay visible. Brand blue #2F81F7 throughout.
    Every platform icon derives from this — keep them in sync if the mark
    ever changes:
    - apps/android/app/src/main/res/drawable/ic_launcher.xml (same shape,
      hollow rings, as VectorDrawable path data)
    - apps/android/app/src/main/res/drawable/ic_notification.xml (bolder,
      smaller variant — a stroked ring's hole disappears at 24dp)
    - core/continuityd/src/main.rs build_icon() (same shape, computed
      per-pixel in Rust with 4x supersampling for anti-aliasing, rather
      than rasterized from this file)
  -->
  <g fill="none" stroke="#2F81F7" stroke-width="9">
    <rect x="-4" y="28" width="64" height="24" rx="12" transform="rotate(-25 28 40)" />
    <rect x="34" y="46" width="64" height="24" rx="12" transform="rotate(65 66 58)" />
  </g>
</svg>
