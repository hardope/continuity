[workspace]
resolver = "2"
members = [
    "core/continuity-proto",
    "core/continuity-crypto",
    "core/continuity-net",
    "core/continuity-daemon",
    "core/continuity-ffi",
    "core/continuityd",
    "core/continuityctl",
]

[workspace.package]
version = "0.1.5-beta.8"
edition = "2021"
license = "MIT"
repository = "https://github.com/hardope/continuity"

[workspace.dependencies]
continuity-proto = { path = "core/continuity-proto" }
continuity-crypto = { path = "core/continuity-crypto" }
continuity-net = { path = "core/continuity-net" }
continuity-daemon = { path = "core/continuity-daemon" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"

[profile.release]
opt-level = "z"
lto = true
