# Tests and builds every platform on its own native GitHub-hosted runner,
# and attaches the builds to a GitHub Release when a `v*` tag is pushed.
# Also runnable by hand (workflow_dispatch) without creating a release, so
# a change can be checked on every platform before tagging.
#
# Each platform's code only compiles (let alone runs) on that platform —
# media, remote control, screen lock and sharing all go through OS APIs —
# and the dev machine can't stand in for Windows, Linux or Android. So each
# platform is a lane of its own: its tests, then its build, all lanes in
# parallel, meeting at the release:
#
#   Test (Linux)   -> Build (Linux)   \
#   Test (macOS)   -> Build (macOS)    \
#   Test (Windows) -> Build (Windows)  /  -> Release
#   Test (Engine)  -> Build (Android) /
#
# The phone app is the shared engine behind an FFI layer, so the engine's
# integration tests gate the Android build. Every job's dependencies differ,
# which is also what keeps GitHub's graph drawing each one as its own block
# (it stacks jobs with identical dependencies into one). Separate jobs rather
# than matrices: almost every step is platform-specific (packaging
# especially), and a matrix spent most of its lines on `if: matrix.name ==`.
# (There's no iOS job — see below.)
#
# Release assets are one properly-packaged file per platform, not a raw
# binary — continuityctl (the dev/test CLI) is deliberately not shipped:
#   - macOS: continuity-macos.dmg — a real .app bundle (Info.plist, icon
#     generated from assets/logo.svg, the SwiftUI settings window in
#     Contents/Helpers) inside a .dmg with a drag-to-Applications symlink.
#     A bare Mach-O executable isn't something Finder recognizes as an app.
#     See installers/macos/ and apps/macos/.
#   - Windows: continuity-windows-setup.exe — an Inno Setup installer
#     (installers/windows/continuity.iss). A portable exe has no Start
#     Menu entry, no autostart, and no uninstall.
#   - Linux: continuity-linux.deb — via cargo-deb (package metadata in
#     core/continuityd/Cargo.toml). Its auto-computed Depends: field
#     (libxdo3, libayatana-appindicator3-1, ...) is why this exists at
#     all — a raw binary fails with "error while loading shared
#     libraries" unless those happen to already be installed.
#   - Android: continuity-android.apk — an unsigned debug build. Real
#     distribution needs Play Store signing secrets this repo doesn't have
#     configured; it's still the only place the Kotlin code gets compiled.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── Tests ──────────────────────────────────────────────────────────────

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: bash .github/scripts/install-linux-deps.sh

      - name: Unit tests
        # Every crate's own tests. On Linux, continuityd's include the
        # remote-control portal client against a mock xdg-desktop-portal
        # (src/remote_control_linux/portal_tests.rs) and the PipeWire frame
        # conversion — code nothing else ever runs short of a real desktop.
        run: cargo test --workspace --lib --bins

  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Unit tests
        run: cargo test --workspace --lib --bins

      - name: Settings window tests
        # The SwiftUI settings window's client, against a fake continuityd
        # on a real loopback socket, plus its half of the JSON contract
        # (Tests/SettingsUITests/Fixtures/status.json — continuityd's own
        # tests check the other half). No window is opened. This uses the
        # runner's default Xcode, the build job the newest one, so both of
        # the Glass.swift code paths get compiled.
        working-directory: apps/macos/ContinuitySettings
        run: swift test

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Unit tests
        run: cargo test --workspace --lib --bins

  test-engine:
    name: Test (Engine)
    # Pairs of real engines finding each other over loopback mDNS:
    # connection races, revocation, remote-control sessions and their end
    # reasons, remote lock (core/continuity-daemon/tests/). Gates the
    # Android build, which is this engine behind an FFI layer.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        # The engine needs only D-Bus's headers: continuity-crypto's Linux
        # keychain backend (keyring → dbus-secret-service) links libdbus.
        # (The full set in install-linux-deps.sh is for continuityd.)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Build
        run: cargo test -p continuity-daemon --tests --no-run

      - name: Run
        # A failing test used to hang here instead of exiting (the engine's
        # blocking watchers only stopped on an explicit `shutdown()`);
        # dropping an engine now shuts it down, and this cap stays as a
        # backstop. --nocapture shows a failure's message as it happens.
        run: timeout 600 cargo test -p continuity-daemon --tests -- --nocapture

  # ─── Builds ─────────────────────────────────────────────────────────────

  build-linux:
    name: Build (Linux)
    needs: test-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: bash .github/scripts/install-linux-deps.sh

      - name: Build
        # continuityctl isn't released, but cheap — this keeps it building.
        run: cargo build --release -p continuityd -p continuityctl

      - name: Build .deb package
        # The raw binary dynamically links libxdo, libayatana-appindicator3,
        # etc. — fine here where they're installed, but a user running the
        # raw binary hits "error while loading shared libraries" unless they
        # happen to have the same packages. A .deb's Depends: field fixes
        # this by making apt/dpkg pull them in automatically. cargo-deb's
        # default ("$auto", see core/continuityd/Cargo.toml) computes that
        # list itself by running ldd against the built binary — no
        # hand-maintained package list to drift.
        run: |
          cargo install cargo-deb --locked
          cargo deb -p continuityd --no-build
          cp target/debian/*.deb continuity-linux.deb

      - uses: actions/upload-artifact@v4
        with:
          name: continuity-linux.deb
          path: continuity-linux.deb

  build-macos:
    name: Build (macOS)
    needs: test-macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build continuityctl
        # Not released (it's the dev/test CLI), but cheap — this keeps it
        # building.
        run: cargo build --release -p continuityctl

      - name: Build universal continuityd (Intel + Apple Silicon)
        # GitHub's macos-latest runner is Apple Silicon, so a plain
        # `cargo build` there produces an arm64-only binary — which
        # doesn't run at all on an Intel Mac ("not supported"). Building
        # both targets and merging with lipo is the standard fix; this is
        # the same technique already used for the iOS XCFramework (see
        # docs/ios-build.md).
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin -p continuityd
          cargo build --release --target aarch64-apple-darwin -p continuityd
          mkdir -p target/release
          lipo -create \
            target/x86_64-apple-darwin/release/continuityd \
            target/aarch64-apple-darwin/release/continuityd \
            -output target/release/continuityd
          lipo -info target/release/continuityd

      - name: Build .app bundle + .dmg
        # Wrapping the binary as a real .app (Info.plist, icon) inside a
        # .dmg (with a drag-to-Applications symlink) is the standard macOS
        # distribution shape. LSUIElement=true in Info.plist means no Dock
        # icon, matching the tray-only design.
        run: |
          APP=Continuity.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/release/continuityd "$APP/Contents/MacOS/continuityd"
          chmod +x "$APP/Contents/MacOS/continuityd"
          cp installers/macos/Info.plist "$APP/Contents/Info.plist"
          # Stamp the workspace version into the bundle — the checked-in
          # plist's number is only a default, and sat at 0.1.5-beta.14
          # for several releases while it was edited by hand.
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleVersion $VERSION" \
            -c "Set :CFBundleShortVersionString $VERSION" \
            "$APP/Contents/Info.plist"

          # `sips` doesn't reliably rasterize SVG, but `qlmanage -t` (the
          # QuickLook thumbnail generator) does — render once at the
          # largest icon size, then downscale with sips for the rest.
          # qlmanage requires the output dir to already exist, and names
          # its output after the input file.
          mkdir -p AppIcon.iconset /tmp/icon-src
          qlmanage -t -s 1024 -o /tmp/icon-src assets/logo.svg
          mv /tmp/icon-src/logo.svg.png /tmp/icon-src/base.png
          for size in 16 32 128 256 512; do
            sips -z $size $size /tmp/icon-src/base.png --out AppIcon.iconset/icon_${size}x${size}.png
            double=$((size * 2))
            sips -z $double $double /tmp/icon-src/base.png --out AppIcon.iconset/icon_${size}x${size}@2x.png
          done
          iconutil -c icns AppIcon.iconset -o "$APP/Contents/Resources/AppIcon.icns"

          # The settings window (apps/macos/ContinuitySettings), a SwiftUI
          # app the tray's "Settings…" opens from Contents/Helpers. Built
          # with the newest non-beta Xcode on the runner: the macOS 26 SDK
          # is what gives it Liquid Glass (an older SDK still builds it,
          # with the classic look).
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -vi beta | tail -1 || true)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          echo "macOS SDK $(xcrun --sdk macosx --show-sdk-version)"
          mkdir -p "$APP/Contents/Helpers"
          apps/macos/ContinuitySettings/build-app.sh "$APP/Contents/Helpers" "$VERSION" "$APP/Contents/Resources/AppIcon.icns"

          # Ad-hoc signing (no paid Apple Developer ID, just a local
          # self-signature) isn't enough to satisfy Gatekeeper's "verified
          # developer" check, but it IS required for the binary to run at
          # all on Apple Silicon — completely unsigned code shows "app is
          # damaged and can't be opened, move to trash" there, a dead end
          # with no bypass, unlike the normal unsigned-app warning
          # ("unidentified developer" — right-click Open still works).
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"

          mkdir dmg-src
          mv "$APP" dmg-src/
          ln -s /Applications dmg-src/Applications
          hdiutil create -volname Continuity -srcfolder dmg-src -ov -format UDZO continuity-macos.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: continuity-macos.dmg
          path: continuity-macos.dmg

  build-windows:
    name: Build (Windows)
    needs: test-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        # continuityctl isn't released, but cheap — this keeps it building.
        run: cargo build --release -p continuityd -p continuityctl

      - name: Build installer
        # A raw .exe has no Start Menu entry, no autostart registration,
        # and no clean uninstall — wrap it with Inno Setup so it installs
        # like a normal Windows app instead of being a file you have to
        # keep around and relaunch by hand. windows-latest ships
        # Chocolatey preinstalled, so this doesn't need a separate
        # runner setup.
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          Copy-Item target\release\continuityd.exe installers\windows\continuityd.exe
          # The workspace version, so "Apps & features" shows the release
          # actually installed (see the #ifndef in continuity.iss).
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" installers\windows\continuity.iss
          Copy-Item installers\windows\continuity-windows-setup.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: continuity-windows-setup.exe
          path: continuity-windows-setup.exe

  build-android:
    name: Build (Android)
    needs: test-engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android,armv7-linux-androideabi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # v4, not v3: v3 always installs the SDK's old `tools` package, which
      # Google stopped serving in September 2026 — every v3 run now fails
      # with "Failed to find package 'tools'" before anything is built.
      # v4 dropped it from its defaults and exports the same
      # ANDROID_SDK_ROOT/ANDROID_HOME and sdkmanager PATH the steps below use.
      - uses: android-actions/setup-android@v4

      - name: Install NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Cross-compile continuity-ffi
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
        run: |
          cd core/continuity-ffi
          cargo ndk -t arm64-v8a -t x86_64 -o ../../apps/android/app/src/main/jniLibs build --release

      - name: Build APK
        working-directory: apps/android
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Stage release APK
        run: cp apps/android/app/build/outputs/apk/debug/app-debug.apk continuity-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: continuity-android.apk
          path: continuity-android.apk

  # No iOS job — it doesn't build cleanly yet (an embedded-extension
  # code-signing validation failure survived two rounds of real fixes:
  # a missing XCFramework simulator architecture and a Homebrew
  # tap-trust check on the runner, both fixed, but a third distinct
  # failure remained) and no device or simulator has ever actually run
  # this app. See docs/ios-build.md for the manual build path and
  # what's left to chase down; re-add a job here once it's sorted out.

  # ─── Release ────────────────────────────────────────────────────────────

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    # Each build already waits for its own lane's tests, so this waits for
    # everything.
    needs: [build-linux, build-macos, build-windows, build-android]
    runs-on: ubuntu-latest
    # The default GITHUB_TOKEN is read-only unless a job explicitly asks
    # for more — softprops/action-gh-release needs contents: write to
    # actually create the release, or it 403s with "Resource not
    # accessible by integration".
    permissions:
      contents: write
    steps:
      # Needed for CHANGELOG.md below — this job otherwise only downloads
      # artifacts, no source checkout by default.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          # Each artifact is already exactly one file (see each build job's
          # upload step) — merge them into one flat directory instead of one
          # subdirectory per artifact name, so the release gets raw files,
          # not a zip per platform. Every asset is a packaged format (.dmg,
          # the installer .exe, .deb, .apk) whose permissions are set inside
          # the package itself at build time.
          merge-multiple: true

      # Pulls this exact version's section out of CHANGELOG.md (between
      # its `## [x.y.z]` heading and the next one) so the release gets
      # real, human-written notes instead of just an auto-generated
      # commit list. Degrades gracefully — an empty file here just means
      # `generate_release_notes` below is the only source, not a failed
      # release — for a tag cut before CHANGELOG.md has a matching entry.
      - name: Extract this release's changelog section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]") > 0) { found = 1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::warning::No CHANGELOG.md section found for $VERSION — release will use auto-generated notes only."
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: release_notes.md
          # GitHub appends its own auto-generated commit/PR summary after
          # `body_path`'s content rather than replacing it — curated notes
          # up top, full commit list below for anyone who wants it.
          generate_release_notes: true
          # Standard semver pre-release convention: a tag like
          # `v0.1.5-beta.1` gets flagged as a GitHub pre-release (shown
          # with a "Pre-release" badge, excluded from "Latest" and from
          # what a plain `git clone`/update-checker treating "Latest"
          # specially would pick up); a plain `v0.1.5` doesn't. Driven
          # entirely by the tag name — nothing else to set by hand when
          # cutting one.
          prerelease: ${{ contains(github.ref_name, '-') }}
