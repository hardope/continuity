# Builds every platform on its own native GitHub-hosted runner and attaches
# the results to a GitHub Release when a `v*` tag is pushed. Also runnable
# by hand (workflow_dispatch) without creating a release, so a PR can be
# checked on every platform before tagging.
#
# Why this matters beyond "automate the build": this dev machine (macOS,
# no sudo, no full Xcode) could locally verify macOS and Android, but not
# Windows or Linux (missing system headers/toolchains for cross-compiling
# TLS's C dependencies — see docs/protocol.md and continuity-crypto's
# Cargo.toml). CI sidesteps that by building on each platform's own real
# runner. (There's no ios job — see the comment above the release job.)
#
# The Android artifact here is unsigned (debug APK) — real distribution
# needs Play Store signing secrets this repo doesn't have configured.
# Still valuable as continuous "does it even build" verification.
#
# Release assets are one properly-packaged file per platform, not a raw
# binary — continuityctl (the dev/test CLI) is deliberately not shipped:
#   - macOS: continuity-macos.dmg — a real .app bundle (Info.plist, icon
#     generated from assets/logo.svg) inside a .dmg with a drag-to-
#     Applications symlink. A bare Mach-O executable isn't something
#     Finder recognizes as an app; double-clicking it opened it as an
#     unknown/text file instead of running it. See installers/macos/.
#   - Windows: continuity-windows-setup.exe — an Inno Setup installer
#     (installers/windows/continuity.iss). A portable exe has no Start
#     Menu entry, no autostart, and no uninstall.
#   - Linux: continuity-linux.deb — via cargo-deb (package metadata in
#     core/continuityd/Cargo.toml). Its auto-computed Depends: field
#     (libxdo3, libayatana-appindicator3-1, ...) is why this exists at
#     all — a raw binary fails with "error while loading shared
#     libraries" unless those happen to already be installed.
#   - Android: continuity-android.apk (unsigned debug build — real
#     distribution needs Play Store signing secrets this repo doesn't
#     have configured, but it's still valuable as continuous "does it
#     even build" verification).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies (tray-icon, secret-service, rustls)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          # libappindicator3-dev doesn't exist on Ubuntu 24.04 (ubuntu-latest)
          # anymore — libayatana-appindicator3-dev is its replacement and
          # what's actually needed. libxdo-dev is for muda (tray-icon's
          # menu library) — it links against libxdo for keyboard-accelerator
          # handling even though we don't set any menu accelerators yet.
          # dpkg-dev provides dpkg-shlibdeps, which cargo-deb's "$auto"
          # depends resolution (core/continuityd/Cargo.toml) needs to
          # compute the .deb's Depends: field — without it, cargo-deb
          # silently produces a .deb with no dependency information at
          # all, defeating the reason it exists.
          sudo apt-get install -y \
            libgtk-3-dev libayatana-appindicator3-dev \
            libdbus-1-dev libxdo-dev pkg-config dpkg-dev

      - name: Build
        # Still building continuityctl too (cheap, shares most deps) even
        # though it isn't released — catches regressions in it via CI. On
        # macOS, continuityd itself isn't built here — see "Build
        # universal continuityd" below.
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = "macos" ]; then
            cargo build --release -p continuityctl
          else
            cargo build --release -p continuityd -p continuityctl
          fi

      - name: Build universal continuityd (Intel + Apple Silicon)
        # GitHub's macos-latest runner is Apple Silicon, so a plain
        # `cargo build` there produces an arm64-only binary — which
        # doesn't run at all on an Intel Mac ("not supported"). Building
        # both targets and merging with lipo is the standard fix; this is
        # the same technique already used for the iOS XCFramework (see
        # docs/ios-build.md).
        if: matrix.name == 'macos'
        shell: bash
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin -p continuityd
          cargo build --release --target aarch64-apple-darwin -p continuityd
          mkdir -p target/release
          lipo -create \
            target/x86_64-apple-darwin/release/continuityd \
            target/aarch64-apple-darwin/release/continuityd \
            -output target/release/continuityd
          lipo -info target/release/continuityd

      - name: Build macOS .app bundle + .dmg
        # A bare Mach-O executable isn't something Finder recognizes as an
        # app — double-clicking it opens it as a text/unknown file instead
        # of running it. Wrapping it as a real .app (Info.plist, icon) and
        # shipping that inside a .dmg (with a drag-to-Applications
        # symlink) is the standard macOS distribution shape and fixes
        # that. LSUIElement=true in Info.plist also means no Dock icon,
        # matching the tray-only design.
        if: matrix.name == 'macos'
        shell: bash
        run: |
          APP=Continuity.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/release/continuityd "$APP/Contents/MacOS/continuityd"
          chmod +x "$APP/Contents/MacOS/continuityd"
          cp installers/macos/Info.plist "$APP/Contents/Info.plist"

          # `sips` doesn't reliably rasterize SVG, but `qlmanage -t` (the
          # QuickLook thumbnail generator) does — render once at the
          # largest icon size, then downscale with sips for the rest.
          # qlmanage requires the output dir to already exist, and names
          # its output after the input file.
          mkdir -p AppIcon.iconset /tmp/icon-src
          qlmanage -t -s 1024 -o /tmp/icon-src assets/logo.svg
          mv /tmp/icon-src/logo.svg.png /tmp/icon-src/base.png
          for size in 16 32 128 256 512; do
            sips -z $size $size /tmp/icon-src/base.png --out AppIcon.iconset/icon_${size}x${size}.png
            double=$((size * 2))
            sips -z $double $double /tmp/icon-src/base.png --out AppIcon.iconset/icon_${size}x${size}@2x.png
          done
          iconutil -c icns AppIcon.iconset -o "$APP/Contents/Resources/AppIcon.icns"

          # Ad-hoc signing (no paid Apple Developer ID, just a local
          # self-signature) isn't enough to satisfy Gatekeeper's "verified
          # developer" check, but it IS required for the binary to run at
          # all on Apple Silicon — completely unsigned code shows "app is
          # damaged and can't be opened, move to trash" there, a dead end
          # with no bypass, unlike the normal unsigned-app warning
          # ("unidentified developer" — right-click Open still works).
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"

          mkdir dmg-src
          mv "$APP" dmg-src/
          ln -s /Applications dmg-src/Applications
          hdiutil create -volname Continuity -srcfolder dmg-src -ov -format UDZO continuity-macos.dmg

      - name: Upload macOS .dmg
        if: matrix.name == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: continuity-macos.dmg
          path: continuity-macos.dmg

      - name: Build Linux .deb package
        # The raw binary dynamically links libxdo, libayatana-appindicator3,
        # etc. (see the apt-get step above) — fine in CI where they're
        # installed, but a user running the raw binary on their own machine
        # hits "error while loading shared libraries" unless they happen to
        # already have the same packages. A .deb's Depends: field fixes
        # this by making apt/dpkg pull them in automatically. cargo-deb's
        # default ("$auto", see core/continuityd/Cargo.toml) computes that
        # list itself by running ldd against the built binary — no need to
        # hand-maintain a package list here that would drift from the one
        # above.
        if: matrix.name == 'linux'
        shell: bash
        run: |
          cargo install cargo-deb --locked
          cargo deb -p continuityd --no-build
          cp target/debian/*.deb continuity-linux.deb

      - name: Upload Linux .deb
        if: matrix.name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: continuity-linux.deb
          path: continuity-linux.deb

      - name: Build Windows installer
        # A raw .exe has no Start Menu entry, no autostart registration,
        # and no clean uninstall — wrap it with Inno Setup so it installs
        # like a normal Windows app instead of being a file you have to
        # keep around and relaunch by hand. windows-latest ships
        # Chocolatey preinstalled, so this doesn't need a separate
        # runner setup.
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          Copy-Item target\release\continuityd.exe installers\windows\continuityd.exe
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installers\windows\continuity.iss
          Copy-Item installers\windows\continuity-windows-setup.exe .

      - name: Upload Windows installer
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: continuity-windows-setup.exe
          path: continuity-windows-setup.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android,armv7-linux-androideabi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Cross-compile continuity-ffi
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
        run: |
          cd core/continuity-ffi
          cargo ndk -t arm64-v8a -t x86_64 -o ../../apps/android/app/src/main/jniLibs build --release

      - name: Build APK
        working-directory: apps/android
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Stage release APK
        run: cp apps/android/app/build/outputs/apk/debug/app-debug.apk continuity-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: continuity-android.apk
          path: continuity-android.apk

  # No ios job — it doesn't build cleanly yet (an embedded-extension
  # code-signing validation failure survived two rounds of real fixes:
  # a missing XCFramework simulator architecture and a Homebrew
  # tap-trust check on the runner, both fixed, but a third distinct
  # failure remained) and no device or simulator has ever actually run
  # this app. See docs/ios-build.md for the manual build path and
  # what's left to chase down; re-add a job here once it's sorted out.

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    # The default GITHUB_TOKEN is read-only unless a job explicitly asks
    # for more — softprops/action-gh-release needs contents: write to
    # actually create the release, or it 403s with "Resource not
    # accessible by integration".
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          # Each artifact is already exactly one file (see the desktop/
          # android jobs' "Upload ..."/"Stage release ..." steps) — merge
          # them into one flat directory instead of one subdirectory per
          # artifact name, so the release gets raw files, not a zip per
          # platform. Every asset is now a packaged format (.dmg, the
          # installer .exe, .deb, .apk) whose permissions are set inside
          # the package itself at build time, so there's no separate
          # executable-bit step needed here anymore.
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          # Standard semver pre-release convention: a tag like
          # `v0.1.5-beta.1` gets flagged as a GitHub pre-release (shown
          # with a "Pre-release" badge, excluded from "Latest" and from
          # what a plain `git clone`/update-checker treating "Latest"
          # specially would pick up); a plain `v0.1.5` doesn't. Driven
          # entirely by the tag name — nothing else to set by hand when
          # cutting one.
          prerelease: ${{ contains(github.ref_name, '-') }}
